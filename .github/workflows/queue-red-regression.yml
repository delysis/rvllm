name: Queue receipt identity regression (before fix)

on:
  pull_request:
    paths: ['.github/workflows/queue-red-regression.yml']

permissions:
  contents: read

jobs:
  red:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: v3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v3
          key: queue-host-release
      - name: Record exact unchanged implementation and attach the regression
        run: |
          mkdir -p "$RUNNER_TEMP/queue-red"
          git rev-parse HEAD > "$RUNNER_TEMP/queue-red/commit.txt"
          subject=crates/rvllm-runtime/src/bin/rvllm_experiment_queue/queue.rs
          test "$(git hash-object "$subject")" = 2fc26595fa27b18495f5a09e1bdfc53e9759a492
          printf '\n#[cfg(test)]\n#[path = "qualification_tests.rs"]\nmod qualification_tests;\n' >> "$subject"
          git diff -- "$subject" > "$RUNNER_TEMP/queue-red/test-overlay.patch"
      - run: cargo fetch --locked
      - name: Run behavioral regression against the pre-fix implementation
        run: |
          cargo test --offline --locked --release -j 2 -p rvllm-runtime \
            --features macos-private-ane-research --bin rvllm_experiment_queue \
            dependency_report_must_identify_its_job -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/queue-red/tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queue-red-regression
          path: ${{ runner.temp }}/queue-red
          retention-days: 14
          if-no-files-found: error
