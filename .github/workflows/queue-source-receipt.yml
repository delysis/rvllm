name: Queue continuation source receipt

on:
  pull_request:
    paths: ['.github/workflows/queue-source-receipt.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive only tracked source and its identity
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/queue-source"
          git rev-parse HEAD > "$RUNNER_TEMP/queue-source/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/queue-source/tree.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/queue-source/inventory.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/queue-source/source.tar.gz"
          sha256sum "$RUNNER_TEMP/queue-source/source.tar.gz" > "$RUNNER_TEMP/queue-source/source.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: queue-source
          path: ${{ runner.temp }}/queue-source
          retention-days: 7
          if-no-files-found: error
