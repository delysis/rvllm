[package]
name = "rvllm-serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# rvllm-serve: HTTP serving loop. Reuses step_launch/step_collect.
# OpenAI-compatible API. See v3/specs/05-concurrency.md for the tokio -> worker channel design.

[[bin]]
name = "rvllm-server"
path = "src/main.rs"

[features]
default = []
apple = [
    "dep:rvllm-apple",
    "dep:rvllm-loader",
    "dep:sha2",
    "dep:tokenizers",
    "rvllm-runtime/apple",
]
apple-bench = ["apple"]
macos-private-ane-research = ["apple", "rvllm-runtime/macos-private-ane-research"]

[dependencies]
rvllm-core = { workspace = true }
rvllm-apple = { workspace = true, optional = true }
rvllm-loader = { workspace = true, optional = true }
rvllm-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { version = "0.10", optional = true }
tokenizers = { version = "0.20", optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ctrlc = { version = "3.5", features = ["termination"] }
