[package]
name = "rvllm-apple"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# rvllm-apple: safe, host-testable Apple Silicon backend contracts.
#
# No private-framework FFI lives in this crate. Direct Objective-C/IOSurface
# access lives in `rvllm-apple-ane-sys` and is consumed only through safe
# wrappers behind explicit macOS/aarch64/research-only cfg gates.

[features]
default = []
metal = []
mlx = []
# Host-only tooling that assembles immutable application model packages. The
# embedded iOS runtime validates packages but does not include their builder.
package-builder = []
# Private Apple frameworks are unsupported research tooling. This feature must
# never be enabled in an App Store or other shipping build.
macos-private-ane-research = ["dep:rvllm-apple-ane-sys"]
# Backwards-compatible alias. Code is gated on the explicitly named research
# feature above so that release manifests and binary scans have one clear flag.
private-ane = ["macos-private-ane-research"]

[dependencies]
rvllm-core = { workspace = true }
tracing = { workspace = true }
half = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
prost = "0.14"
sha2 = "0.10"
fs4 = "0.13"
rvllm-apple-coreml-sys = { path = "../rvllm-apple-coreml-sys" }
rvllm-apple-coreml-runtime = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
rvllm-apple-ane-sys = { path = "../rvllm-apple-ane-sys", optional = true }
objc2 = "0.6"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "rvllm_apple_package"
path = "src/bin/rvllm_apple_package.rs"
required-features = ["package-builder"]
